networks:
  web:
    driver: overlay
    attachable: true
  intercom-new:
    driver: overlay
    attachable: true


volumes:
  order_pg_vol:
  minio_vol:

secrets:
  postgres_user:
    file: docker/postgres_user_secret
  postgres_password:
    file: docker/postgres_password_secret
  s3_user:
    file: docker/s3_user_secret
  s3_password:
    file: docker/s3_password_secret

services:
  traefik:
    image: traefik:v3.6.1
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=sbd_web
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Traefik reads Swarm API
    networks:
      - web
    deploy:
      # todo
      # Replicate only to manager
      # expose dashboard to localhost/dashboard
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.entrypoints=web"
        - "traefik.http.services.dashboard.loadbalancer.server.port=8080"


  frontend:
    image: ghcr.io/ddibiasi/sbd-ais-exercise/frontend:1.0
    networks:
      - web
    environment:
      - API_URL=http://orders.localhost
    deploy:
      # todo deploy globally
      # should be available at http://localhost from every node
        mode: global
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.frontend.rule=Host(`localhost`)"
          - "traefik.http.routers.frontend.entrypoints=web"
          - "traefik.http.services.frontend.loadbalancer.server.port=80"


  orderservice:
    image: ghcr.io/ddibiasi/sbd-ais-exercise/orderservice:1.0
    command: ["/bin/sh", "-c", "echo 'Waiting for DBs...' && sleep 15 && /app/ordersystem"]
    depends_on:
      - postgres
      - minio
    secrets:
      # todo use secrets
      - postgres_user
      - postgres_password
      - s3_user
      - s3_password
    environment:
      - POSTGRES_DB=order
      - PGPORT=5555
      - DB_HOST=postgres
      - S3_ENDPOINT=minio:8500
      # todo use secrets
      - S3_ACCESS_KEY_ID_FILE=/run/secrets/s3_user
      - S3_SECRET_ACCESS_KEY_FILE=/run/secrets/s3_password
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    networks:
      - web
      - intercom-new
    deploy:
      # todo deploy global
      mode: global
      # Should be reachable at http://orders.localhost
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.orders.rule=Host(`orders.localhost`)"
        - "traefik.http.routers.orders.entrypoints=web"
        - "traefik.http.services.orders.loadbalancer.server.port=3000"
      # always restart container on failure
      restart_policy:
          condition: any
          delay: 5s
          max_attempts: 10
          window: 120s

  postgres:
    image: postgres:latest
    command: ["postgres", "-p", "5555"]
    volumes:
      - order_pg_vol:/var/lib/postgresql
    networks:
      - intercom-new
    secrets:
      # todo use secrets
      - postgres_user
      - postgres_password
    environment:
      - POSTGRES_DB=order
      - PGPORT=5555
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      # todo use secrets
    deploy:
      # todo replicate only to one worker node
      # todo use constraints
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-desktop

  minio:
    image: minio/minio:latest
    command: [ "server", "--address", ":8500", "/data" ]
    volumes:
      - minio_vol:/data
    secrets:
      # todo use secrets
      - s3_user
      - s3_password
    environment:
      # todo use secrets
      - MINIO_ROOT_USER_FILE=/run/secrets/s3_user
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/s3_password
    networks:
      - intercom-new
    deploy:
      # todo replicate only to one worker node
      # todo use constraints
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-desktop